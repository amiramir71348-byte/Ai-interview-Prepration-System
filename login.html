<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Interview Preparation</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left-panel">

        <div class="logo">

            <i class="fa-solid fa-brain"></i>

            <h2>AI Interview Prep</h2>

        </div>

        <h1>

            Welcome Back!

        </h1>

        <p>

            Practice AI Mock Interviews, Improve Your Resume,
            Get Personalized Feedback and Crack Your Dream Job.

        </p>

        <img src="assets/images/login.png"
        alt="Login Image">

    </div>

    <div class="right-panel">

        <form id="loginForm">

            <h2>

                Login

            </h2>

            <p>

                Sign in to continue your interview preparation.

            </p>

            <div class="inputBox">

                <label>Email Address</label>

                <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            </div>

            <div class="inputBox">

                <label>Password</label>

                <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>

            </div>
            <!-- Remember Me & Forgot Password -->

            <div class="rememberRow">

                <label class="remember">

                    <input
                    type="checkbox"
                    id="remember">

                    Remember Me

                </label>

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <!-- Login Button -->

            <button
            type="submit"
            class="loginBtn">

                Login

            </button>

            <!-- Divider -->

            <div class="divider">

                <span>OR</span>

            </div>

            <!-- Google Login -->

            <button
            type="button"
            class="googleBtn">

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>

            <!-- Signup -->

            <div class="signupLink">

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </div>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
